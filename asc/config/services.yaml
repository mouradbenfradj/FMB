# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
# config/services.yaml


    admin.parc:
        class: App\Admin\ParcAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Parc, manager_type: orm, label: Parc }
    admin.filiere:
        class: App\Admin\FiliereAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Filiere, manager_type: orm, label: Filiere }
    admin.segment:
        class: App\Admin\SegmentAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Segment, manager_type: orm, label: Segment }
    admin.flotteur:
        class: App\Admin\FlotteurAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Flotteur, manager_type: orm, label: Flotteur }
    admin.flotteur.segment:
        class: App\Admin\FlotteurSegmentAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\FlotteurSegment, manager_type: orm, label: FlotteurSegment }
    admin.emplacement:
        class: App\Admin\EmplacementAdmin
        tags:
            - { name: sonata.admin, model_class: App\Entity\Emplacement, manager_type: orm, label: Emplacement }