services:
  App\Service\Cache\ParcCacheService:
    arguments:
      $parcRepository: '@App\Repository\ParcRepository'
      $cache: "@cache.app"
      $mouleCalculator: '@App\Service\MouleCalculator'

  App\EventSubscriber\ParcCacheDoctrineSubscriber:
    tags:
      - { name: doctrine.event_subscriber, connection: default }

  App\EventListener\ParcCacheInvalidator:
    arguments:
      $parcCacheService: '@App\Service\Cache\ParcCacheService'
    tags:
      - { name: doctrine.orm.entity_listener }

  App\EventListener\CacheInvalidationListener:
    arguments:
      $cacheService: '@App\Service\Cache\CacheRedisService'
      $entityManager: "@doctrine.orm.entity_manager"

  admin.parc:
    class: App\Admin\ParcAdmin
    tags:
      - {
          name: sonata.admin,
          model_class: App\Entity\Parc,
          manager_type: orm,
          label: Parc,
          group: Parc d'élevage,
        }
