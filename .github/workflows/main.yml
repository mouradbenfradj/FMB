name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2.8.4

      - name: Install PHP dependencies
        run: |
          composer update --optimize-autoloader --no-scripts --no-interaction

      # 🎯 ÉTAPE CLÉ : BUILD AVEC SQLITE (sans créer .env.local)
      - name: Build assets (environnement temporaire)
        run: |
          mkdir -p var
          touch var/data.db
          chmod -R 777 var

          # Utiliser DATABASE_URL temporaire UNIQUEMENT pour cette commande
          DATABASE_URL="sqlite:///%kernel.project_dir%/var/data.db" php bin/console assets:install --no-debug --relative

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install Yarn and build assets
        run: |
          npm install -g yarn
          yarn install
          yarn build

      # 🎯 CRÉER .env.local PROD À LA TOUTE FIN (dans un répertoire séparé)
      - name: Prepare production .env.local
        run: |
          mkdir -p deploy-config
          {
            echo "APP_ENV=prod"
            echo "APP_DEBUG=true"
            echo "APP_SECRET=${GITHUB_SHA}"
            echo "MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0"
            echo "DATABASE_URL='mysql://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}/${{ secrets.DB_NAME }}'"
            echo "MAILER_DSN=${{ secrets.MAILER_DSN }}"
            echo "CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1|aquafishtritarconsult\.com)(:[0-9]+)?$'"
          } > deploy-config/.env.local

      # 🎯 DÉPLACER LE FICHIER PROD DANS LE RÉPERTOIRE DE DÉPLOIEMENT
      - name: Finalize deployment files
        run: |
          mv deploy-config/.env.local ./
          # Nettoyer la base SQLite qui ne doit pas être déployée
          rm -f var/data.db

      # 🎯 DÉPLOYER TOUT, Y COMPRIS LE .env.local PROD
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./"
          server-dir: "./www/"
          exclude: |
            **/.devcontainer/**
            **/UBold_v4.0.1/**
            **/.github/**
            **/.idea/**
            **/.vscode/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.bfg-report*/**
            **/var/cache/**

      # ... reste du workflow ...
      - name: Trigger migrations and verify deployment
        run: |
          # Run migrations with secured password
          INSTALL_PASSWORD="${{ secrets.INSTALL_PASSWORD }}"
          curl --insecure "https://www.aquafishtritarconsult.com/database_install.php?password=${INSTALL_PASSWORD}"

          # Verify deployment
          echo "Verifying deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.aquafishtritarconsult.com)
          if [ $HTTP_CODE -ne 200 ] && [ $HTTP_CODE -ne 302 ]; then
            echo "Deployment verification failed! Site returned HTTP code $HTTP_CODE"
            exit 1
          fi
          echo "Deployment verified successfully!"
