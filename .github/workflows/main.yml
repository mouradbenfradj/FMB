name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          tools: composer:v2.8.4

      - name: Create .env.local file for MySQL
        run: |
          cd www
          {
            echo "APP_ENV=prod"
            echo "APP_DEBUG=0"
            echo "APP_SECRET=${GITHUB_SHA}"
            echo "MESSENGER_TRANSPORT_DSN=doctrine://default?auto_setup=0"
            echo "DATABASE_URL=mysql://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}"
            echo "MAILER_DSN=${MAILER_DSN:-null://null}"
            echo "CORS_ALLOW_ORIGIN='^https?://(localhost|127\.0\.0\.1|aquafishtritarconsult\.com)(:[0-9]+)?$'"
          } > ./.env.local
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MAILER_DSN: ${{ secrets.MAILER_DSN }}

      - name: List workspace contents
        run: |
          pwd
          ls -la

      - name: Install PHP dependencies
        run: |
          cd asc
          composer install --optimize-autoloader --no-scripts

      - name: Set up Node.js 20
        uses: actions/setup-node@v2
        with:
          node-version: "20"

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Node.js dependencies with Yarn
        run: |
          cd asc
          yarn install

      - name: Create necessary directories and SQLite databases
        run: |
          cd asc
          mkdir -p var
          touch var/data.db
          touch var/oysterpro.db
          chmod -R 777 var

      - name: Build assets with Yarn
        run: |
          cd asc
          yarn build

      - name: Clear and Warmup Symfony Cache
        run: |
          cd asc
          php bin/console cache:clear --env=prod --no-debug
          php bin/console cache:warmup --env=prod --no-debug

      - name: Install FTP client
        run: sudo apt-get install -y ftp

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: "./asc/"
          server-dir: "./"
          exclude: |
            **/.devcontainer/**
            **/.github/**
            **/.idea/**
            **/.vscode/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.bfg-report*/**
            **/var/cache/**
      - name: Trigger migrations and verify deployment
        run: |
          # Run migrations with secured password
          INSTALL_PASSWORD="${{ secrets.INSTALL_PASSWORD }}"
          curl --insecure "https://www.aquafishtritarconsult.com/database_install.php?password=${INSTALL_PASSWORD}"

          # Verify deployment
          echo "Verifying deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://www.aquafishtritarconsult.com)
          if [ $HTTP_CODE -ne 200 ]; then
            echo "Deployment verification failed! Site returned HTTP code $HTTP_CODE"
            exit 1
          fi
          echo "Deployment verified successfully!"
